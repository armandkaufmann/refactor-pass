# The scripts' test suite (tests/), on the systems and Pythons the README names. Standard library and git only.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13", "3.14"]
        include:
          # The oldest Pythons the README claims, where a runner still offers them.
          - os: ubuntu-22.04
            python: "3.7"
          - os: ubuntu-22.04
            python: "3.8"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the tests
        run: python -m unittest discover -s tests -t . -v
